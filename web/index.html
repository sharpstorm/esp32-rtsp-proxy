<!DOCTYPE html>
<html>

<head>
  <title>ESP32 RTSP Bridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #4a9eff;
      margin-bottom: 10px;
    }

    .section {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    input,
    button {
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
      width: 100%;
    }

    button {
      background: #4a9eff;
      cursor: pointer;
      width: auto;
      margin-right: 10px;
    }

    button:hover {
      background: #3a8eef;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
      display: none;
    }

    video.active {
      display: block;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: #aaa;
    }

    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      display: none;
    }

    .status.success {
      background: #2d5016;
      color: #8bc34a;
      display: block;
    }

    .status.error {
      background: #5d1616;
      color: #f44336;
      display: block;
    }

    .stats {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    .ptz-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .ptz-pad {
      position: relative;
      width: 153px;
      height: 153px;
      margin: 10px auto;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 50%;
    }

    .ptz-btn {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #4a9eff;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 18px;
      user-select: none;
      margin: 0;
    }

    .ptz-btn:hover {
      background: #3a8eef;
    }

    .ptz-btn:active {
      background: #2a7edf;
    }

    .ptz-up {
      top: 5px;
      left: 52px;
    }

    .ptz-down {
      bottom: 5px;
      left: 52px;
    }

    .ptz-left {
      top: 52px;
      left: 5px;
    }

    .ptz-right {
      top: 52px;
      right: 5px;
    }

    .ptz-center {
      top: 52px;
      left: 52px;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ESP32 RTSP Bridge</h1>

    <div class="section">
      <div style="margin-top: 15px;">
        <button onclick="saveAndStart()">Start Stream</button>
        <button onclick="stopStream()">Stop</button>
      </div>
      <div id="status" class="status"></div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="section">
      <h2>Video Stream</h2>
      <video id="video" controls autoplay muted></video>
      <div id="videoStatus" style="margin-top:10px; color:#888;"></div>
    </div>
    <div class="section">
      <h2>PTZ Controls</h2>
      <div class="ptz-container">
        <div>
          <h3 style="text-align:center; margin-bottom:10px;">Direction</h3>
          <div class="ptz-pad">
            <button class="ptz-btn ptz-up" onmousedown="movePTZ(0, 0.5)" onmouseup="stopPTZ()"
              ontouchstart="movePTZ(0, 0.5)" ontouchend="stopPTZ()">&#9650;</button>
            <button class="ptz-btn ptz-down" onmousedown="movePTZ(0, -0.5)" onmouseup="stopPTZ()"
              ontouchstart="movePTZ(0, -0.5)" ontouchend="stopPTZ()">&#9660;</button>
            <button class="ptz-btn ptz-left" onmousedown="movePTZ(-0.5, 0)" onmouseup="stopPTZ()"
              ontouchstart="movePTZ(-0.5, 0)" ontouchend="stopPTZ()">&#9664;</button>
            <button class="ptz-btn ptz-right" onmousedown="movePTZ(0.5, 0)" onmouseup="stopPTZ()"
              ontouchstart="movePTZ(0.5, 0)" ontouchend="stopPTZ()">&#9658;</button>
            <button class="ptz-btn ptz-center" onclick="homePosition()">&#9678;</button>
          </div>
        </div>
        <div>
          <h3 style="text-align:center; margin-bottom:10px;">Quick Actions</h3>
          <button onclick="homePosition()" style="width:100%; margin-top:20px;">Return to Home</button>
          <button onclick="stopPTZ()" style="width:100%; margin-top:10px; background:#666;">Stop Movement</button>
        </div>
      </div>
    </div>
  </div>

  <script src="jmuxer.min.js"></script>
  <script>
    let ws = null;
    let jmuxer = null;

    async function saveAndStart() {
      const response = await fetch('/api/rtsp/start');
      const text = await response.text();

      if (response.ok) {
        showStatus('Stream starting...', 'success');
        setTimeout(connectWebSocket, 1000);
      } else {
        showStatus('Failed: ' + text, 'error');
      }
    }

    function connectWebSocket() {
      const wsUrl = 'ws://' + location.hostname + '/ws';
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        console.log('WebSocket connected');
        setupVideoPlayer();
        updateStats();
      };

      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          const data = new Uint8Array(event.data);
          let offset = 0;

          // Loop through the batch until we reach the end
          while (offset < data.length) {
            // 1. Read the 2-byte length header
            if (offset + 2 > data.length) break; // Safety check
            const len = (data[offset] << 8) | data[offset + 1];
            offset += 2;

            // 2. Extract the actual RTP packet
            if (offset + len > data.length) break; // Safety check
            const rtpPacket = data.subarray(offset, offset + len);

            // 3. Pass it to your existing logic
            // Note: We pass rtpPacket.buffer to keep types consistent if needed, 
            // or just update parseRTPPacket to accept Uint8Array directly.
            parseRTPPacket(rtpPacket);

            // 4. Move to next packet
            offset += len;
          }
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showStatus('WebSocket error', 'error');
      };

      ws.onclose = () => {
        console.log('WebSocket closed');
        document.getElementById('video').classList.remove('active');
      };
    }

    function setupVideoPlayer() {
      const video = document.getElementById('video');
      video.classList.add('active');

      resetDepacketizer();

      jmuxer = new JMuxer({
        node: 'video',
        mode: 'video',
        flushingTime: 200,   // lower = less latency; raise toward 500 if choppy
        fps: 15,
        debug: false,
        onError: () => {
          // MSE decode error -> drop back to the next keyframe and recover
          resync();
        }
      });

      document.getElementById('videoStatus').textContent =
        'Video player ready - waiting for data...';
    }

    // --- H.264 depacketizer state ---
    let nalBuffer = [];            // accumulates one fragmented (FU-A) NAL
    let expectedSeq = null;        // next RTP sequence number we expect
    let frameCorrupt = false;      // a packet was lost inside the current NAL
    let waitingForKeyframe = true; // drop output until the next clean GOP

    function setVideoStatus(msg) {
      const vs = document.getElementById('videoStatus');
      if (vs) vs.textContent = msg;
    }

    // A packet was lost: the NAL we're building is incomplete, and every
    // P-frame from here references data the decoder never received, so it
    // would smear/block until the next keyframe. Drop everything until then
    // instead of feeding garbage to the decoder.
    function resync() {
      if (!waitingForKeyframe) setVideoStatus('Packet loss - waiting for next keyframe...');
      frameCorrupt = true;
      waitingForKeyframe = true;
      nalBuffer = [];
    }

    // Reached a fresh keyframe (SPS / IDR): safe to start decoding again.
    function resume() {
      if (waitingForKeyframe) setVideoStatus('Live');
      waitingForKeyframe = false;
    }

    function resetDepacketizer() {
      nalBuffer = [];
      expectedSeq = null;
      frameCorrupt = false;
      waitingForKeyframe = true;
    }

    function parseRTPPacket(data) {
      const view = data instanceof Uint8Array ? data : new Uint8Array(data);
      if (view.length < 13) return;

      // --- RTP header (skip CSRC list + extension header if present) ---
      const cc = view[0] & 0x0f;
      let headerLen = 12 + cc * 4;
      if (view[0] & 0x10) { // extension header present
        const extLen = (view[headerLen + 2] << 8) | view[headerLen + 3];
        headerLen += 4 + extLen * 4;
      }
      const seq = (view[2] << 8) | view[3];
      const payload = view.subarray(headerLen);
      if (payload.length < 1) return;

      // --- Detect loss / reordering via the sequence number ---
      if (expectedSeq !== null && seq !== expectedSeq) resync();
      expectedSeq = (seq + 1) & 0xffff; // 16-bit wrap

      const nalHeader = payload[0];
      const nalType = nalHeader & 0x1f;

      // 1. Single NAL Unit (SPS, PPS, or small P-Frame)
      if (nalType >= 1 && nalType <= 23) {
        if (nalType === 7 || nalType === 5) resume(); // SPS or IDR -> clean start
        if (waitingForKeyframe) return;

        const singleNal = new Uint8Array(payload.length + 4);
        singleNal.set([0, 0, 0, 1], 0); // Add Annex-B Start Code
        singleNal.set(payload, 4);
        jmuxer.feed({ video: singleNal });
      }

      // 2. Fragmented NAL Unit (FU-A) - Most common for high-res frames
      else if (nalType === 28) {
        const fuHeader = payload[1];
        const isStart = (fuHeader & 0x80) !== 0;
        const isEnd = (fuHeader & 0x40) !== 0;
        const actualNalType = fuHeader & 0x1f;
        const reconstructionHeader = (nalHeader & 0xe0) | actualNalType;
        const fragmentBody = payload.subarray(2);

        if (isStart) {
          frameCorrupt = false; // a new NAL begins; previous loss is behind us
          if (actualNalType === 7 || actualNalType === 5) resume();
          nalBuffer = [0, 0, 0, 1, reconstructionHeader];
          for (let i = 0; i < fragmentBody.length; i++) nalBuffer.push(fragmentBody[i]);
        } else if (nalBuffer.length > 0) {
          for (let i = 0; i < fragmentBody.length; i++) nalBuffer.push(fragmentBody[i]);
        } else {
          frameCorrupt = true; // joined mid-NAL, its start fragment was lost
        }

        if (isEnd) {
          // Only feed a frame that is whole AND part of a clean GOP.
          if (!frameCorrupt && !waitingForKeyframe && nalBuffer.length > 0) {
            jmuxer.feed({ video: new Uint8Array(nalBuffer) });
          }
          nalBuffer = [];
          frameCorrupt = false;
        }
      }
    }

    async function stopStream() {
      if (ws) {
        ws.close();
        ws = null;
      }

      if (jmuxer) {
        jmuxer.destroy();
        jmuxer = null;
      }

      await fetch('/api/rtsp/stop');
      document.getElementById('video').classList.remove('active');
      showStatus('Stream stopped', 'success');
    }

    function updateStats() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      fetch('/api/rtsp/stats')
        .then(r => r.json())
        .then(stats => {
          document.getElementById('stats').innerHTML =
            `Packets: ${stats.packets} | ` +
            `Bytes: ${(stats.bytes / 1024).toFixed(1)}KB | ` +
            `Free heap: ${(stats.freeHeap / 1024).toFixed(1)}KB`;
        });

      setTimeout(updateStats, 5000);
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
      setTimeout(() => el.style.display = 'none', 3000);
    }

    async function movePTZ(x, y) {
      await fetch('/api/onvif/ptz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'move', x: x, y: y })
      });
    }

    async function stopPTZ() {
      await fetch('/api/onvif/ptz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'stop' })
      });
    }

    async function homePosition() {
      await fetch('/api/onvif/ptz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'home' })
      });
    }
  </script>
</body>

</html>
